backend:
  name: git-gateway
  branch: main # Si tu rama principal de GitHub se llama "master", cambia "main" por "master"

media_folder: "assets/img/noticias" # Carpeta donde se guardarán las fotos que suban
public_folder: "/assets/img/noticias"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "data/noticias" # Aquí se guardará cada noticia automáticamente
    create: true # Permite a los trabajadores crear noticias nuevas
    delete: true # Permite a los trabajadores borrar noticias
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Contenido de la noticia", name: "body", widget: "markdown" }
