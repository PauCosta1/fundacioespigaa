<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Panell d'administració · Fundació L'Espiga</title>
  
  <!-- Font Awesome 6 (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS de Netlify CMS -->
  <link href="https://unpkg.com/netlify-cms@^2.10.0/dist/cms.css" rel="stylesheet" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-principal: #de6225;
      --color-secundari: #FDF6E3;
      --color-destacat: #c55520;
      --color-text: #000000;
      --tipografia-principal: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--tipografia-principal);
      background-color: var(--color-secundari);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      max-width: 460px;
      width: 100%;
      background: rgba(253, 246, 227, 0.97);
      border-radius: 32px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25);
      padding: clamp(1.8rem, 6vw, 2.8rem) clamp(1.5rem, 5vw, 2.5rem);
      text-align: center;
    }

    .logo-espiga-login {
      height: 85px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .login-header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--color-principal) 0%, #e87a3f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #5a4a3a;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .missatge-error {
      background: #ffe6e2;
      border-left: 5px solid #de6225;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #b13e0a;
      display: none;
      align-items: center;
      gap: 12px;
    }

    .boto-accedir {
      width: 100%;
      background: linear-gradient(105deg, var(--color-principal), #e87a3f);
      border: none;
      padding: 14px 18px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      border-radius: 44px;
      cursor: pointer;
      margin-top: 1rem;
    }

    .boto-accedir:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(222, 98, 37, 0.3);
    }

    .login-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #7a6a5c;
      border-top: 1px solid rgba(222, 98, 37, 0.2);
      padding-top: 1.2rem;
    }

    .login-footer a {
      color: #c55520;
      text-decoration: none;
    }

    /* Ocultem el CMS fins que l'usuari faci login */
    .cms-wrapper {
      display: none;
    }

    .cms-wrapper.visible {
      display: block;
    }
  </style>
</head>
<body>

<!-- Pantalla de login personalizada -->
<div id="loginScreen" class="login-container">
  <div class="login-header">
    <img src="/logo espiga.png" alt="Fundació L'Espiga" class="logo-espiga-login" onerror="this.src='https://placehold.co/200x80?text=Fundació+L%27Espiga'">
    <h1>Accés treballadors</h1>
    <p>Panell d'administració</p>
  </div>

  <div id="missatgeError" class="missatge-error">
    <i class="fas fa-exclamation-triangle"></i>
    <span id="errorText"></span>
  </div>

  <button id="loginButton" class="boto-accedir">
    <i class="fas fa-arrow-right-to-bracket"></i> Iniciar sessió
  </button>

  <div class="login-footer">
    <p>Fundació L'Espiga · Entitat compromesa amb les persones</p>
    <p>© 2026 · Àrea privada de treballadors</p>
  </div>
</div>

<!-- Aquí se cargará Netlify CMS después del login -->
<div id="cmsContainer"></div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const loginScreen = document.getElementById("loginScreen");
  const loginButton = document.getElementById("loginButton");
  const errorDiv = document.getElementById("missatgeError");
  const errorText = document.getElementById("errorText");

  function mostrarError(mensaje) {
    errorText.textContent = mensaje;
    errorDiv.style.display = "flex";
    setTimeout(() => {
      errorDiv.style.display = "none";
    }, 3000);
  }

  // Inicializar Netlify Identity
  if (window.netlifyIdentity) {
    window.netlifyIdentity.init();

    // Verificar si ya hay usuario logueado
    const user = window.netlifyIdentity.currentUser();
    if (user) {
      // Si ya está logueado, mostrar el CMS directamente
      loginScreen.style.display = "none";
      cargarCMS();
    }

    // Botón de login
    loginButton.addEventListener("click", function() {
      window.netlifyIdentity.open("login");
    });

    // Cuando el usuario hace login
    window.netlifyIdentity.on("login", function(user) {
      console.log("Usuario logueado:", user.email);
      loginScreen.style.display = "none";
      cargarCMS();
    });

    // Error de login
    window.netlifyIdentity.on("error", function(err) {
      console.error("Error de login:", err);
      mostrarError("Usuari o contrasenya incorrectes");
    });

    // Logout
    window.netlifyIdentity.on("logout", function() {
      console.log("Usuario deslogueado");
      loginScreen.style.display = "block";
      location.reload();
    });

  } else {
    mostrarError("Error: No s'ha pogut carregar Netlify Identity");
  }

  function cargarCMS() {
    // El CMS ya está cargado con el script de arriba
    // Solo aseguramos que se vea bien
    console.log("CMS cargado y listo");
  }
});
</script>

</body>
</html>
